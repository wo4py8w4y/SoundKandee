name: Android CI & FOSS Build Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit & Robolectric Compose Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify Zero Proprietary Runtime Dependencies
        run: |
          if gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon | grep -qE "com\.google\.(android\.gms|firebase|mlkit)"; then
            echo "Proprietary dependency detected in releaseRuntimeClasspath!"
            exit 1
          fi
          echo "Verified clean FOSS releaseRuntimeClasspath."
